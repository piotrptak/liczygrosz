<!DOCTYPE html>
<html lang="pl">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>%WEB_TITLE%</title>
    <meta name="description" content="LiczyGrosz – prosty, prywatny tracker wydatków. Dane synchronizowane między telefonem a komputerem." />
    <meta name="theme-color" content="#F5F6F8" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0B0D12" media="(prefers-color-scheme: dark)" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="LiczyGrosz" />
    <!-- The base URL placeholder is filled in by scripts/postbuild-web.mjs -->
    <link rel="manifest" href="__BASE_URL__/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="__BASE_URL__/icons/apple-touch-icon.png" />
    <style id="expo-reset">
      html,
      body {
        height: 100%;
      }
      body {
        overflow: hidden;
        margin: 0;
        background-color: #f5f6f8;
      }
      @media (prefers-color-scheme: dark) {
        body {
          background-color: #0b0d12;
        }
      }
      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }
    </style>
    <script>
      // Service worker: caches the app shell so the PWA opens offline and installs on the home screen.
      (function () {
        var base = '__BASE_URL__/';
        if (base.charAt(0) === '_' || !('serviceWorker' in navigator)) return; // dev server
        navigator.serviceWorker.register(base + 'sw.js', { scope: base });
      })();
    </script>
  </head>
  <body>
    <noscript>LiczyGrosz wymaga włączonej obsługi JavaScript.</noscript>
    <div id="root"></div>
  </body>
</html>
